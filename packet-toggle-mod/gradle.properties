# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric Properties
# 重要: 以下のバージョン文字列はビルド時にネットワーク接続できなかったため
# 確定確認ができていません。ビルド前に必ず https://fabricmc.net/develop/ で
# 対象Minecraftバージョン(1.21.x最新)向けの最新値に更新してください。
# 値が古い/存在しない場合、Gradle依存解決エラーとして分かりやすく失敗します。
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.16.9

# Mod Properties
mod_version=1.0.0
maven_group=dev.packettoggle
archives_base_name=packettoggle

# Dependencies (https://fabricmc.net/develop/ の Fabric API バージョンを確認)
fabric_version=0.102.0+1.21.1
