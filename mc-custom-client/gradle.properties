# Gradleに割り当てるメモリを増やす
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric properties
# https://fabricmc.net/develop/ の最新バージョンと合わない場合はここを更新してください
minecraft_version=26.3
# officialMojangMappings()が「見つからない」エラーになったため暫定復活。
# ビルド番号は未確認の推測値(build.1)。存在しなければCIの依存解決エラーで判明する。
yarn_mappings=26.3+build.1
loader_version=0.19.5
loom_version=1.17-SNAPSHOT

# Mod properties
mod_version=0.1.0
maven_group=io.github.rnkg2008623
archives_base_name=mc-custom-client

# Dependencies
fabric_version=0.160.6+26.3
