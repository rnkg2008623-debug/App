plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // 他のMODに依存する場合はここにmavenリポジトリを追加してください。
    // Minecraft本体・Fabric関連の依存はLoomが自動的に解決します。
}

dependencies {
    // バージョンは gradle.properties で管理しています
    //
    // Minecraft 26.1以降は難読化(obfuscation)自体が廃止され、配布される
    // ゲーム本体が最初からMojang公式の人間可読な名前(クラス名・メソッド名)を
    // 持つようになったため、Yarn/Mojangマッピングの指定は一切不要になった
    // (公式のfabric-example-modのbuild.gradleで実際に確認済み)。
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API
    // "include" で自分のMODのjarに同梱(Jar-in-Jar)する。
    // これにより利用者はFabric APIを別途インストールしなくても
    // このjarをmodsフォルダに入れるだけで動くようになる。
    include implementation("net.fabricmc.fabric-api:fabric-api:${project.fabric_version}")
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
